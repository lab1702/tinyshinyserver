<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <script src="{{base_url}}/templates/scripts/theme.js"></script>
  <link rel="stylesheet" href="{{base_url}}/templates/styles/main.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
        </span>
        <span class="brand-name">{{title}}</span>
      </div>
      <div class="topbar-actions">
        <div class="connection-status" id="connectionStatus" role="status" title="Connecting...">
          <span class="status-indicator" id="statusIndicator"></span>
          <span class="status-text" id="statusText">Connecting...</span>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div class="page-header">
      <div>
        <h1>Applications</h1>
        <p>Choose an application to open it. On-demand apps start when opened.</p>
      </div>
    </div>

    <div class="apps-grid">
      {{app_cards}}
    </div>
  </main>

  <script>
    let refreshInterval;
    let isConnected = false; // Start as disconnected until we verify connection

    function setConnectionStatus(connected) {
      const status = document.getElementById("connectionStatus");
      const indicator = document.getElementById("statusIndicator");
      const statusText = document.getElementById("statusText");
      const label = connected ? "Connected" : "Connection lost";

      indicator.className = "status-indicator " + (connected ? "connected" : "disconnected");
      statusText.className = "status-text " + (connected ? "connected" : "disconnected");
      statusText.textContent = label;
      status.title = label;
      isConnected = connected;
    }

    function setCardEnabled(linkElement, cardElement, enabled, title, action) {
      if (enabled) {
        linkElement.href = "/proxy/" + cardElement.dataset.app + "/";
        linkElement.removeAttribute("aria-disabled");
      } else {
        linkElement.removeAttribute("href");
        linkElement.setAttribute("aria-disabled", "true");
      }
      linkElement.classList.toggle("is-disabled", !enabled);
      cardElement.classList.toggle("app-disabled", !enabled);
      linkElement.title = title;
      const actionElement = cardElement.querySelector(".app-open");
      if (actionElement) actionElement.textContent = action;
    }

    function updateAppStatus() {
      // Create abort controller for timeout
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000); // 3 second timeout

      fetch("/api/apps", {
        method: "GET",
        cache: "no-cache",
        headers: {
          "Cache-Control": "no-cache"
        },
        signal: controller.signal
      })
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          return response.json();
        })
        .then(data => {
          clearTimeout(timeoutId);

          if (!isConnected) {
            setConnectionStatus(true);
          }

          // A configuration reload can add or remove apps; the server renders the new cards
          const cardNames = Array.from(document.querySelectorAll(".app-card"), card => card.dataset.app).sort();
          const appNames = Object.values(data).map(app => app.name).sort();
          if (JSON.stringify(cardNames) !== JSON.stringify(appNames)) {
            clearInterval(refreshInterval);
            location.reload();
            return;
          }

          Object.values(data).forEach(app => {
            const statusElement = document.getElementById("status-" + app.name);
            const connectionsElement = document.getElementById("connections-" + app.name);
            const cardElement = document.querySelector(`[data-app="${app.name}"]`);
            const linkElement = cardElement ? cardElement.closest("a") : null;

            if (statusElement) {
              statusElement.textContent = app.status;
              statusElement.className = "status-badge status-" + app.status;
            }

            if (connectionsElement) {
              connectionsElement.textContent = app.connections === 1 ? "1 connection" : app.connections + " connections";
            }

            if (linkElement && cardElement) {
              if (app.status === "running") {
                setCardEnabled(linkElement, cardElement, true, "Open " + app.name, "Open app");
              } else if (app.status === "dormant") {
                setCardEnabled(linkElement, cardElement, true, "Start and open " + app.name + " (on-demand app)", "Start app");
              } else if (app.status === "stopped") {
                setCardEnabled(linkElement, cardElement, false, "App is stopped - use the management interface to start it", "Unavailable");
              } else if (app.status === "crashed") {
                setCardEnabled(linkElement, cardElement, false, "App has crashed - use the management interface to restart it", "Unavailable");
              } else {
                setCardEnabled(linkElement, cardElement, false, "App is not available (" + app.status + ")", "Unavailable");
              }
            }
          });
        })
        .catch(error => {
          clearTimeout(timeoutId);
          console.error("Error fetching app status:", error);
          setConnectionStatus(false);

          // Show the server as down and disable all app tiles
          document.querySelectorAll(".app-card").forEach(card => {
            const linkElement = card.closest("a");
            const statusBadge = card.querySelector(".status-badge");

            if (statusBadge) {
              statusBadge.textContent = "server down";
              statusBadge.className = "status-badge status-stopped";
            }
            if (linkElement) {
              setCardEnabled(linkElement, card, false, "Server is down - apps are not accessible", "Unavailable");
            }
          });
        });
    }

    // Initial load - don't assume connected, let updateAppStatus determine status
    updateAppStatus();

    // Auto-refresh every 5 seconds
    refreshInterval = setInterval(updateAppStatus, 5000);

    // Clean up interval when page is about to unload
    window.addEventListener("beforeunload", function() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
      }
    });
  </script>
</body>
</html>
