<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{app_name}} - {{title}}</title>
  <script src="{{base_url}}/templates/scripts/theme.js"></script>
  <link rel="stylesheet" href="{{base_url}}/templates/styles/main.css">
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>{{app_name}}</h1>
      <p id="startStatus" role="status">{{status}}</p>
    </div>
    <div class="info">
      <p>
        <span id="startHint">This page reloads automatically until the application is ready.</span>
        <a href="{{base_url}}/">Back to all applications</a>
      </p>
    </div>
  </main>

  <script>
    // Reload until the app answers, but stop after two minutes: a tab left
    // open on an app that cannot start would otherwise restart it forever.
    (function () {
      var retryMs = {{retry_seconds}} * 1000;
      // The longest time that the server holds a request for the app before
      // it answers, plus time for the network
      var answerMs = {{answer_seconds}} * 1000 + 10000;
      var giveUpMs = 120000;
      // How long an app that failed waits before it can start again. The
      // limit above counts from the end of that wait, at which the reload
      // starts the app; a wait that the app's failure begins later, while
      // the page reloads, counts toward the limit.
      var delayMs = {{delay_seconds}} * 1000;
      var key = "tss-starting:" + window.location.pathname;
      var now = Date.now();
      var wait = null;

      function stopReloading(message) {
        document.getElementById("startStatus").textContent = message;
        document.getElementById("startHint").textContent = "Reload the page to try again.";
      }

      // The wait is kept across reloads in sessionStorage or, where site data
      // is blocked, in the tab's window.name, unless something other than
      // these pages uses it. The name stays on the app's page once the app
      // answers, and on the pages after it, which may be other sites', so it
      // holds a hash of the page's address rather than the address.
      var namePrefix = "tss-starting ";
      function ownsName() {
        return window.name === "" || window.name.indexOf(namePrefix) === 0 ||
          window.name.indexOf("tss-landing ") === 0;
      }
      function nameKey() {
        var hash = 5381;
        for (var i = 0; i < key.length; i++) {
          hash = ((hash * 33) ^ key.charCodeAt(i)) >>> 0;
        }
        return hash.toString(36);
      }
      function loadWait() {
        var value = null;
        try {
          value = JSON.parse(window.sessionStorage.getItem(key));
        } catch (e) {
          value = null;
        }
        if (value) return value;
        try {
          if (window.name.indexOf(namePrefix) === 0) {
            var kept = JSON.parse(window.name.slice(namePrefix.length));
            if (kept && kept.key === nameKey()) return kept.wait;
          }
        } catch (e) {
          // Not a wait that this page kept
        }
        return null;
      }
      function saveWait(value) {
        try {
          window.sessionStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          // Site data is blocked; try the tab's name
        }
        if (!ownsName()) return false;
        window.name = namePrefix + JSON.stringify({ key: nameKey(), wait: value });
        return true;
      }
      function forgetWait() {
        try {
          window.sessionStorage.removeItem(key);
        } catch (e) {
          // Nothing was stored there
        }
        if (window.name.indexOf(namePrefix) === 0) window.name = "";
      }

      wait = loadWait();
      // A page that this script reloaded continues the same wait, measured
      // from the moment of the reload: the page before may have waited longer
      // than this one does, as one that reports a restart delay does, and a
      // browser may delay the timers of a tab in the background. Any other
      // visit, such as the visitor reloading the page, starts a new wait.
      // The record stays when the reload reaches the app instead, so a page
      // continues the wait only if its own navigation began at the reload:
      // one that the visitor opens after the app's page, as when the app
      // stops again, does not. The server may hold the reload's request for
      // a while, which does not count. Without performance.now(), the page
      // is taken for the reload if it loads within the time the server can
      // hold it.
      var navigationStart = window.performance && typeof window.performance.now === "function" ?
        now - window.performance.now() : null;
      var reloaded = wait && typeof wait.reloadedAt === "number" && (navigationStart === null ?
        now >= wait.reloadedAt && now - wait.reloadedAt <= answerMs :
        navigationStart >= wait.reloadedAt - 1000 && navigationStart - wait.reloadedAt <= 2000);
      if (!reloaded) {
        wait = { first: now + delayMs };
      }
      delete wait.reloadedAt;

      if (now - wait.first >= giveUpMs) {
        forgetWait();
        stopReloading("This application is still not ready.");
        return;
      }

      // Without a place to keep it, the wait cannot be limited, so the page
      // does not reload
      if (!saveWait(wait)) {
        stopReloading("This application is not ready yet.");
        return;
      }
      window.setTimeout(function () {
        wait.reloadedAt = Date.now();
        if (!saveWait(wait)) {
          stopReloading("This application is not ready yet.");
          return;
        }
        window.location.reload();
      }, retryMs);
    })();
  </script>
</body>
</html>
