<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{app_name}} - {{title}}</title>
  <script src="{{base_url}}/templates/scripts/theme.js"></script>
  <link rel="stylesheet" href="{{base_url}}/templates/styles/main.css">
</head>
<body>
  <main class="container">
    <div class="header">
      <h1>{{app_name}}</h1>
      <p id="startStatus" role="status">This application is starting.</p>
    </div>
    <div class="info">
      <p>
        <span id="startHint">This page reloads automatically until the application is ready.</span>
        <a href="{{base_url}}/">Back to all applications</a>
      </p>
    </div>
  </main>

  <script>
    // Reload until the app answers, but stop after two minutes: a tab left
    // open on an app that cannot start would otherwise restart it forever.
    (function () {
      var retryMs = {{retry_seconds}} * 1000;
      // The longest time that the server holds a request for the app before
      // it answers, plus time for the network
      var answerMs = {{answer_seconds}} * 1000 + 10000;
      var giveUpMs = 120000;
      var key = "tss-starting:" + window.location.pathname;
      var now = Date.now();
      var wait = null;

      function stopReloading(message) {
        document.getElementById("startStatus").textContent = message;
        document.getElementById("startHint").textContent = "Reload the page to try again.";
      }

      try {
        wait = JSON.parse(window.sessionStorage.getItem(key));
      } catch (e) {
        wait = null;
      }
      // A page that this script reloaded continues the same wait, measured
      // from the moment of the reload: the page before may have waited longer
      // than this one does, as one that reports a restart delay does, and a
      // browser may delay the timers of a tab in the background. Any other
      // visit, such as the visitor reloading the page, starts a new wait.
      var reloaded = wait && typeof wait.reloadedAt === "number" &&
        now >= wait.reloadedAt && now - wait.reloadedAt <= answerMs;
      if (!reloaded) {
        wait = { first: now };
      }
      delete wait.reloadedAt;

      if (now - wait.first >= giveUpMs) {
        try {
          window.sessionStorage.removeItem(key);
        } catch (e) {
          // Nothing was stored
        }
        stopReloading("This application is still not ready.");
        return;
      }

      try {
        window.sessionStorage.setItem(key, JSON.stringify(wait));
      } catch (e) {
        // Without storage the wait cannot be limited, so do not reload
        stopReloading("This application is not ready yet.");
        return;
      }
      window.setTimeout(function () {
        wait.reloadedAt = Date.now();
        try {
          window.sessionStorage.setItem(key, JSON.stringify(wait));
        } catch (e) {
          stopReloading("This application is not ready yet.");
          return;
        }
        window.location.reload();
      }, retryMs);
    })();
  </script>
</body>
</html>
