<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Management - {{title}}</title>
    <script src="{{base_url}}/templates/scripts/theme.js"></script>
    <link rel="stylesheet" href="{{base_url}}/templates/styles/main.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
                </span>
                <span class="brand-name">{{title}}</span>
                <span class="brand-tag">Management</span>
            </div>
            <div class="topbar-actions">
                <div class="connection-status" id="connectionStatus" role="status" title="Connected">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span class="status-text" id="statusText">Connected</span>
                </div>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container page">
        <div class="page-header">
            <div>
                <h1>Server management</h1>
                <p>Monitor and manage your Shiny applications.</p>
            </div>
            <div class="page-actions">
                <button class="reload-btn" type="button" onclick="reloadConfig()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
                    <span>Reload Config &amp; Restart All</span>
                </button>
                <button class="shutdown-btn" type="button" onclick="shutdownServer()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
                    <span>Shutdown Server</span>
                </button>
            </div>
        </div>

        <div class="notice" id="notice" role="status" hidden></div>

        <div class="status-grid" id="systemStatus">
            <div class="loading">Loading system status...</div>
        </div>

        <section class="section">
            <div class="section-header">
                <h2>Applications</h2>
            </div>
            <div class="manage-apps" id="appsContainer">
                <div class="loading">Loading applications...</div>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>Active connections</h2>
                <span class="auto-refresh">Auto-refreshing every 5 seconds</span>
            </div>
            <div class="panel table-wrap" id="connectionsContainer">
                <div class="loading">Loading connections...</div>
            </div>
        </section>

        <section class="panel session-info">
            <h4>Server information</h4>
            <pre>{{session_info}}</pre>
        </section>
    </main>

    <script>
        let refreshInterval;
        let isConnected = true;
        let noticeTimer;

        function setConnectionStatus(connected) {
            const status = document.getElementById("connectionStatus");
            const indicator = document.getElementById("statusIndicator");
            const statusText = document.getElementById("statusText");
            const label = connected ? "Connected" : "Connection lost";

            indicator.className = "status-indicator " + (connected ? "connected" : "disconnected");
            statusText.className = "status-text " + (connected ? "connected" : "disconnected");
            statusText.textContent = label;
            status.title = label;
            isConnected = connected;
        }

        function showNotice(message, kind) {
            const notice = document.getElementById("notice");
            notice.textContent = message;
            notice.className = "notice notice-" + (kind || "info");
            notice.hidden = false;
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(() => { notice.hidden = true; }, 6000);
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            if (hours > 0) {
                return `${hours}h ${minutes}m ${secs}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text == null ? "" : String(text);
            return node;
        }

        function updateSystemStatus() {
            fetch("/api/status")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!isConnected) {
                        setConnectionStatus(true);
                    }

                    const cards = [
                        ["Total apps", data.total_apps],
                        ["Running apps", data.running_apps],
                        ["Active connections", data.total_connections]
                    ].map(([label, value]) => {
                        const card = element("div", "status-card");
                        card.append(element("h3", null, label), element("div", "value", value));
                        return card;
                    });
                    document.getElementById("systemStatus").replaceChildren(...cards);
                })
                .catch(error => {
                    console.error("Error fetching system status:", error);
                    setConnectionStatus(false);
                });
        }

        function detail(key, label, value, wide) {
            // Text reads "Label: value" for assistive technology and copy/paste
            const node = element("div", "app-detail" + (wide ? " wide" : ""));
            node.dataset.detail = key;
            const labelNode = element("span", "detail-label", label);
            labelNode.append(element("span", "visually-hidden", ":"));
            node.append(labelNode, " ", element("span", "detail-value", value));
            return node;
        }

        function updateApps() {
            fetch("/api/apps")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!isConnected) {
                        setConnectionStatus(true);
                    }

                    const cards = Object.values(data).map(app => {
                        const card = element("div", "app-card");

                        const header = element("div", "app-header");
                        header.append(
                            element("div", "app-name", app.name),
                            element("span", "status-badge status-" + app.status, app.status)
                        );

                        const details = element("div", "app-details");
                        if (app.resident !== undefined) {
                            details.append(detail("type", "Type", app.resident ? "Resident" : "On-demand"));
                        }
                        details.append(
                            detail("port", "Port", app.port),
                            detail("pid", "PID", typeof app.pid === "number" ? app.pid : "N/A"),
                            detail("connections", "Connections", app.connections),
                            detail("path", "Path", app.path, true)
                        );

                        const actions = element("div", "app-actions");
                        if (app.status !== "dormant") {
                            const button = element("button", "restart-btn", "Restart");
                            button.type = "button";
                            button.addEventListener("click", () => restartApp(button, app.name));
                            actions.append(button);
                        } else {
                            // Dormant (on-demand, stopped) apps start automatically when opened
                            actions.append(element("div", "app-info", "Starts automatically when opened"));
                        }

                        card.append(header, details, actions);
                        return card;
                    });

                    const container = document.getElementById("appsContainer");
                    if (cards.length === 0) {
                        container.replaceChildren(element("div", "empty-state panel", "No applications configured"));
                    } else {
                        container.replaceChildren(...cards);
                    }
                })
                .catch(error => {
                    console.error("Error fetching apps:", error);
                    setConnectionStatus(false);
                });
        }

        function updateConnections() {
            fetch("/api/connections")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!isConnected) {
                        setConnectionStatus(true);
                    }

                    const container = document.getElementById("connectionsContainer");

                    if (Object.keys(data).length === 0) {
                        container.replaceChildren(element("p", "empty-state", "No active connections"));
                        return;
                    }

                    const table = document.createElement("table");
                    table.className = "connections-table";
                    const heading = table.createTHead().insertRow();
                    ["App", "Client IP", "User Agent", "Connected", "Duration", "Last Activity"].forEach(label => {
                        const cell = document.createElement("th");
                        cell.textContent = label;
                        heading.appendChild(cell);
                    });
                    const body = table.createTBody();
                    Object.values(data).forEach(conn => {
                        const row = body.insertRow();
                        [conn.app_name, conn.client_ip, conn.user_agent,
                         conn.connected_at, formatDuration(conn.duration_seconds), conn.last_activity]
                            .forEach((value, index) => {
                                const cell = row.insertCell();
                                cell.textContent = value == null ? "" : String(value);
                                if (index === 2) {
                                    cell.className = "user-agent";
                                    cell.title = cell.textContent;
                                }
                            });
                    });
                    container.replaceChildren(table);
                })
                .catch(error => {
                    console.error("Error fetching connections:", error);
                    setConnectionStatus(false);
                });
        }

        function restartApp(button, appName) {
            button.disabled = true;
            button.textContent = "Restarting...";

            fetch("/api/apps/" + encodeURIComponent(appName) + "/restart", {
                method: "POST",
                headers: { "X-TinyShinyServer-Request": "management" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotice(data.message || "Restart scheduled for " + appName, "success");
                } else {
                    showNotice("Failed to restart " + appName + ": " + data.message, "error");
                }
                button.disabled = false;
                button.textContent = "Restart";
                updateApps();
            })
            .catch(error => {
                console.error("Error restarting app:", error);
                showNotice("Error restarting " + appName + ": " + error.message, "error");
                button.disabled = false;
                button.textContent = "Restart";
            });
        }

        function reloadConfig() {
            const confirmed = confirm(
                "Reload the configuration file and restart all applications? " +
                "Every app will stop and all users will be disconnected. " +
                "Resident apps start again right away; on-demand apps start when next opened."
            );

            if (!confirmed) {
                return;
            }

            const button = document.querySelector(".reload-btn");
            const label = button.querySelector("span");
            button.disabled = true;
            label.textContent = "Reloading...";

            const restore = () => {
                button.disabled = false;
                label.textContent = "Reload Config & Restart All";
            };

            fetch("/api/reload", {
                method: "POST",
                headers: { "X-TinyShinyServer-Request": "management" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotice(data.message || "Reloading configuration", "success");
                    // The server is busy restarting apps; check back shortly for the outcome
                    setTimeout(() => {
                        fetch("/api/status")
                            .then(response => response.json())
                            .then(status => {
                                const result = status.last_reload;
                                if (result && result.success) {
                                    showNotice(result.message, "success");
                                } else if (result) {
                                    showNotice("Reload failed: " + result.message, "error");
                                }
                            })
                            .catch(error => console.error("Error checking reload result:", error))
                            .finally(() => { restore(); refreshAll(); });
                    }, 2000);
                } else {
                    showNotice("Reload rejected: " + (data.message || data.error), "error");
                    restore();
                }
            })
            .catch(error => {
                console.error("Error reloading configuration:", error);
                showNotice("Error reloading configuration: " + error.message, "error");
                restore();
            });
        }

        function showShutdownScreen() {
            const screen = element("main", "shutdown-screen");
            const content = element("div");
            content.append(
                element("h1", null, "Server Shutdown"),
                element("p", null, "The Shiny server has been shut down."),
                element("p", null, "To use it again, restart the server from the command line.")
            );
            screen.append(content);
            document.body.replaceChildren(screen);
        }

        function shutdownServer() {
            const confirmed = confirm(
                "Are you sure you want to shutdown the entire Shiny server? " +
                "This will stop all applications and the management interface. " +
                "You will need to restart the server manually to continue using it."
            );

            if (!confirmed) {
                return;
            }

            const button = document.querySelector(".shutdown-btn");
            const label = button.querySelector("span");
            button.disabled = true;
            label.textContent = "Shutting down...";

            if (refreshInterval) {
                clearInterval(refreshInterval);
            }

            const restore = () => {
                button.disabled = false;
                label.textContent = "Shutdown Server";
                refreshInterval = setInterval(refreshAll, 5000);
            };

            fetch("/api/shutdown", {
                method: "POST",
                headers: { "X-TinyShinyServer-Request": "management" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showShutdownScreen();
                } else {
                    showNotice("Failed to shutdown server: " + data.message, "error");
                    restore();
                }
            })
            .catch(error => {
                console.error("Error shutting down server:", error);
                showNotice("Error shutting down server: " + error.message, "error");
                restore();
            });
        }

        function refreshAll() {
            updateSystemStatus();
            updateApps();
            updateConnections();
        }

        // Initial load
        setConnectionStatus(true);
        refreshAll();

        // Auto-refresh every 5 seconds
        refreshInterval = setInterval(refreshAll, 5000);
    </script>
</body>
</html>
