<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Management - {{title}}</title>
    <!-- Relative URLs keep the page working behind a reverse proxy that strips a path prefix -->
    <script src="templates/scripts/theme.js"></script>
    <link rel="stylesheet" href="templates/styles/main.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
                </span>
                <span class="brand-name">{{title}}</span>
                <span class="brand-tag">Management</span>
            </div>
            <div class="topbar-actions">
                <div class="connection-status" id="connectionStatus" role="status" title="Connected">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span class="status-text" id="statusText">Connected</span>
                </div>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container page">
        <div class="page-header">
            <div>
                <h1 tabindex="-1">Server management</h1>
                <p>Monitor and manage your Shiny applications.</p>
            </div>
            <div class="page-actions">
                <button class="reload-btn" type="button" onclick="reloadConfig()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
                    <span>Reload Config &amp; Restart All</span>
                </button>
                <button class="shutdown-btn" type="button" onclick="shutdownServer()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
                    <span>Shutdown Server</span>
                </button>
            </div>
        </div>

        <!-- The live region stays in the page while empty: one that appears
             already holding its text is not announced by every screen reader -->
        <div class="notice notice-empty" id="noticeBox">
            <div class="notice-text" id="notice" role="status"></div>
            <button class="notice-dismiss" id="noticeDismiss" type="button" aria-label="Dismiss message" onclick="hideNotice()" hidden>&times;</button>
        </div>

        <div class="status-grid" id="systemStatus">
            <div class="loading">Loading system status...</div>
        </div>

        <section class="section">
            <div class="section-header">
                <h2>Applications</h2>
            </div>
            <div class="manage-apps" id="appsContainer">
                <div class="loading">Loading applications...</div>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>Active connections</h2>
                <span class="auto-refresh">Auto-refreshing every 5 seconds</span>
            </div>
            <div class="panel table-wrap" id="connectionsContainer">
                <div class="loading">Loading connections...</div>
            </div>
        </section>

        <section class="panel session-info">
            <h4>Server information</h4>
            <pre>{{session_info}}</pre>
        </section>
    </main>

    <script>
        let refreshInterval;
        let isConnected = true;
        let noticeTimer;

        function setConnectionStatus(connected) {
            const status = document.getElementById("connectionStatus");
            const indicator = document.getElementById("statusIndicator");
            const statusText = document.getElementById("statusText");
            const label = connected ? "Connected" : "Connection lost";

            indicator.className = "status-indicator " + (connected ? "connected" : "disconnected");
            statusText.className = "status-text " + (connected ? "connected" : "disconnected");
            statusText.textContent = label;
            status.title = label;
            isConnected = connected;
        }

        function hideNotice() {
            const box = document.getElementById("noticeBox");
            clearTimeout(noticeTimer);
            // The focus would otherwise drop to the page itself with the
            // dismiss button
            const hadFocus = box.contains(document.activeElement);
            box.className = "notice notice-empty";
            document.getElementById("notice").textContent = "";
            document.getElementById("noticeDismiss").hidden = true;
            if (hadFocus) document.querySelector("main h1").focus();
        }

        // Other notices go after a while, but not while the visitor is
        // pointing at or has focused one
        function scheduleNoticeHide() {
            noticeTimer = setTimeout(() => {
                const box = document.getElementById("noticeBox");
                if (box.matches(":hover") || box.contains(document.activeElement)) {
                    scheduleNoticeHide();
                } else {
                    hideNotice();
                }
            }, 8000);
        }

        function showNotice(message, kind) {
            document.getElementById("noticeBox").className = "notice notice-" + (kind || "info");
            document.getElementById("notice").textContent = message;
            document.getElementById("noticeDismiss").hidden = false;
            clearTimeout(noticeTimer);
            // An error, which may be the only place its reason is shown apart
            // from server.log, stays until it is dismissed or replaced
            if (kind !== "error") scheduleNoticeHide();
        }

        // aria-disabled, unlike disabled, keeps the keyboard focus on a button
        // while its request runs; the button then ignores clicks
        function setBusy(button, busy) {
            if (busy) {
                button.setAttribute("aria-disabled", "true");
            } else {
                button.removeAttribute("aria-disabled");
            }
        }

        function isBusy(button) {
            return button.getAttribute("aria-disabled") === "true";
        }

        function formatDuration(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            if (days > 0) {
                return `${days}d ${hours}h ${minutes}m`;
            } else if (hours > 0) {
                return `${hours}h ${minutes}m ${secs}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        function formatBytes(bytes) {
            const units = ["B", "KB", "MB", "GB", "TB"];
            let value = bytes;
            let unit = 0;
            while (value >= 1024 && unit < units.length - 1) {
                value /= 1024;
                unit++;
            }
            return (unit >= 3 ? value.toFixed(1) : Math.round(value)) + " " + units[unit];
        }

        // Usage fields are absent when the server cannot read them
        function orNA(value, format) {
            return typeof value === "number" ? format(value) : "N/A";
        }

        // The text of a failed request's answer. Error responses carry it as
        // "error", after their status code, as in "500 - Internal Server Error".
        function errorText(data) {
            return String(data.message || data.error || "unknown error").replace(/^\d{3} - /, "");
        }

        function element(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text == null ? "" : String(text);
            return node;
        }

        function updateSystemStatus() {
            fetch("api/status")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!isConnected) {
                        setConnectionStatus(true);
                    }

                    const hasMemory = typeof data.server_memory_bytes === "number";
                    const cards = [
                        ["Total apps", data.total_apps],
                        ["Running apps", data.running_apps],
                        ["Active connections", data.total_connections],
                        ["Uptime", orNA(data.uptime_seconds, formatDuration)],
                        ["Memory in use",
                         hasMemory ? formatBytes(data.server_memory_bytes + data.apps_memory_bytes) : "N/A",
                         hasMemory ? `Server ${formatBytes(data.server_memory_bytes)} · Apps ${formatBytes(data.apps_memory_bytes)}` : null]
                    ].map(([label, value, note]) => {
                        const card = element("div", "status-card");
                        card.append(element("h3", null, label), element("div", "value", value));
                        if (note) card.append(element("div", "note", note));
                        return card;
                    });
                    document.getElementById("systemStatus").replaceChildren(...cards);
                })
                .catch(error => {
                    console.error("Error fetching system status:", error);
                    setConnectionStatus(false);
                });
        }

        function detail(key, label, value, wide) {
            // Text reads "Label: value" for assistive technology and copy/paste
            const node = element("div", "app-detail" + (wide ? " wide" : ""));
            node.dataset.detail = key;
            const labelNode = element("span", "detail-label", label);
            labelNode.append(element("span", "visually-hidden", ":"));
            node.append(labelNode, " ", element("span", "detail-value", value));
            return node;
        }

        // Text that changed is replaced; other text keeps a visitor's selection
        function setText(node, text) {
            const value = text == null ? "" : String(text);
            if (node.textContent !== value) node.textContent = value;
        }

        // Put nodes in a container in this order, moving only nodes that are
        // out of place: moving a node takes the keyboard focus from it
        function arrange(container, nodes) {
            if (nodes.length === container.children.length &&
                nodes.every((node, index) => container.children[index] === node)) {
                return;
            }
            container.replaceChildren(...nodes);
        }

        // Each app's card is made once and then updated in place, so that a
        // refresh keeps the keyboard focus on a Restart button, and a click
        // that spans a refresh still lands
        const appCards = new Map();
        // Apps whose restart is in progress, so that a refresh does not offer
        // the Restart button again in the meantime
        const restarting = new Set();
        let appsData = {};

        function actionKind(app) {
            if (app.status === "unavailable") return "unavailable";
            // A dormant app waiting out restart_delay after a failure can be
            // restarted, which ends the wait
            if (app.status === "dormant" && typeof app.restart_in_seconds !== "number") return "dormant";
            return "restart";
        }

        function renderAppCard(app) {
            let entry = appCards.get(app.name);
            if (!entry) {
                const card = element("div", "app-card");
                const header = element("div", "app-header");
                const badge = element("span");
                header.append(element("h3", "app-name", app.name), badge);
                const details = element("div", "app-details");
                const actions = element("div", "app-actions");
                card.append(header, details, actions);
                entry = { card, badge, details, actions, kind: null, info: null, button: null };
                appCards.set(app.name, entry);
            }

            entry.badge.className = "status-badge status-" + app.status;
            setText(entry.badge, app.status);

            const rows = [];
            if (app.resident !== undefined) {
                rows.push(["type", "Type", app.resident ? "Resident" : "On-demand"]);
            }
            rows.push(
                ["port", "Port", app.port],
                ["pid", "PID", typeof app.pid === "number" ? app.pid : "N/A"],
                ["memory", "Memory", orNA(app.memory_bytes, formatBytes)],
                ["uptime", "Uptime", orNA(app.uptime_seconds, formatDuration)],
                ["connections", "Connections", app.connections],
                ["path", "Path", app.path, true]
            );
            const keys = rows.map(row => row[0]).join(" ");
            if (entry.details.dataset.keys !== keys) {
                entry.details.dataset.keys = keys;
                entry.details.replaceChildren(...rows.map(row => detail(...row)));
            }
            rows.forEach(([key, , value]) => {
                setText(entry.details.querySelector(`[data-detail="${key}"] .detail-value`), value);
            });

            const kind = actionKind(app);
            if (entry.kind !== kind) {
                entry.kind = kind;
                entry.info = null;
                entry.button = null;
                if (kind === "dormant") {
                    // Dormant (on-demand, stopped) apps start automatically when opened
                    entry.actions.replaceChildren(element("div", "app-info", "Starts automatically when opened"));
                } else if (kind === "unavailable") {
                    // An on-demand app whose directory cannot be served
                    entry.actions.replaceChildren(element("div", "app-info", "Cannot start - see server.log for the reason"));
                } else {
                    entry.info = element("div", "app-info");
                    entry.button = element("button", "restart-btn", "Restart");
                    entry.button.type = "button";
                    entry.button.addEventListener("click", () => restartApp(app.name));
                    entry.actions.replaceChildren(entry.info, entry.button);
                }
            }
            if (entry.info) {
                const waiting = typeof app.restart_in_seconds === "number";
                entry.info.hidden = !waiting;
                setText(entry.info, waiting ? `Failed; starts again when opened in ${app.restart_in_seconds}s` : "");
            }
            if (entry.button) {
                const busy = restarting.has(app.name);
                setBusy(entry.button, busy);
                setText(entry.button, busy ? "Restarting..." : "Restart");
                // The app's name tells one card's button from another's for
                // assistive technology
                const label = (busy ? "Restarting " : "Restart ") + app.name;
                if (entry.button.getAttribute("aria-label") !== label) {
                    entry.button.setAttribute("aria-label", label);
                }
            }
            return entry.card;
        }

        function renderApps() {
            const apps = Object.values(appsData);
            const names = new Set(apps.map(app => app.name));
            for (const name of appCards.keys()) {
                if (!names.has(name)) appCards.delete(name);
            }
            const container = document.getElementById("appsContainer");
            if (apps.length === 0) {
                container.replaceChildren(element("div", "empty-state panel", "No applications configured"));
            } else {
                arrange(container, apps.map(renderAppCard));
            }
        }

        function updateApps() {
            fetch("api/apps")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!isConnected) {
                        setConnectionStatus(true);
                    }
                    appsData = data;
                    renderApps();
                })
                .catch(error => {
                    console.error("Error fetching apps:", error);
                    setConnectionStatus(false);
                });
        }

        function updateConnections() {
            fetch("api/connections")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!isConnected) {
                        setConnectionStatus(true);
                    }

                    const container = document.getElementById("connectionsContainer");

                    if (Object.keys(data).length === 0) {
                        connectionsTable = null;
                        connectionRows.clear();
                        container.replaceChildren(element("p", "empty-state", "No active connections"));
                        return;
                    }

                    // Rows are kept by session and updated in place, so that a
                    // refresh does not clear a selected IP address or user agent
                    if (!connectionsTable || !container.contains(connectionsTable)) {
                        connectionsTable = document.createElement("table");
                        connectionsTable.className = "connections-table";
                        const heading = connectionsTable.createTHead().insertRow();
                        ["App", "Client IP", "User Agent", "Connected", "Duration", "Last Activity"].forEach(label => {
                            const cell = document.createElement("th");
                            cell.textContent = label;
                            heading.appendChild(cell);
                        });
                        connectionsTable.createTBody();
                        connectionRows.clear();
                        container.replaceChildren(connectionsTable);
                    }
                    const rows = Object.entries(data).map(([session, conn]) => {
                        let row = connectionRows.get(session);
                        if (!row) {
                            row = document.createElement("tr");
                            for (let index = 0; index < 6; index++) row.insertCell();
                            row.cells[2].className = "user-agent";
                            connectionRows.set(session, row);
                        }
                        [conn.app_name, conn.client_ip, conn.user_agent,
                         conn.connected_at, formatDuration(conn.duration_seconds), conn.last_activity]
                            .forEach((value, index) => setText(row.cells[index], value));
                        row.cells[2].title = row.cells[2].textContent;
                        return row;
                    });
                    for (const session of connectionRows.keys()) {
                        if (!(session in data)) connectionRows.delete(session);
                    }
                    arrange(connectionsTable.tBodies[0], rows);
                })
                .catch(error => {
                    console.error("Error fetching connections:", error);
                    setConnectionStatus(false);
                });
        }

        let connectionsTable = null;
        const connectionRows = new Map();

        function restartApp(appName) {
            if (restarting.has(appName)) {
                return;
            }
            restarting.add(appName);
            renderApps();
            const done = () => {
                restarting.delete(appName);
                renderApps();
            };

            fetch("api/apps/" + encodeURIComponent(appName) + "/restart", {
                method: "POST",
                headers: { "X-TinyShinyServer-Request": "management" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotice(data.message || "Restarted " + appName, "success");
                } else if (data.message) {
                    // The restart endpoint's own answer says which app failed and why
                    showNotice(data.message, "error");
                } else {
                    showNotice("Failed to restart " + appName + ": " + errorText(data), "error");
                }
                done();
                // A restart changes the status tiles and the connection list too
                refreshAll();
            })
            .catch(error => {
                console.error("Error restarting app:", error);
                showNotice("Error restarting " + appName + ": " + error.message, "error");
                done();
            });
        }

        function reloadConfig() {
            const button = document.querySelector(".reload-btn");
            if (isBusy(button)) {
                return;
            }
            const confirmed = confirm(
                "Reload the configuration file and restart all applications? " +
                "Every app will stop and all users will be disconnected. " +
                "Resident apps start again right away; on-demand apps start when next opened."
            );

            if (!confirmed) {
                return;
            }

            const label = button.querySelector("span");
            setBusy(button, true);
            label.textContent = "Reloading...";

            const restore = () => {
                setBusy(button, false);
                label.textContent = "Reload Config & Restart All";
            };

            fetch("api/reload", {
                method: "POST",
                headers: { "X-TinyShinyServer-Request": "management" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotice(data.message || "Reloading configuration", "success");
                    // The server is busy restarting apps; check back shortly for the outcome
                    setTimeout(() => {
                        fetch("api/status")
                            .then(response => response.json())
                            .then(status => {
                                const result = status.last_reload;
                                if (result && result.success) {
                                    showNotice(result.message, "success");
                                } else if (result) {
                                    showNotice("Reload failed: " + result.message, "error");
                                }
                            })
                            .catch(error => console.error("Error checking reload result:", error))
                            .finally(() => { restore(); refreshAll(); });
                    }, 2000);
                } else {
                    showNotice("Reload rejected: " + (data.message || data.error), "error");
                    restore();
                }
            })
            .catch(error => {
                console.error("Error reloading configuration:", error);
                showNotice("Error reloading configuration: " + error.message, "error");
                restore();
            });
        }

        function showShutdownScreen() {
            const screen = element("main", "shutdown-screen");
            const content = element("div");
            content.append(
                element("h1", null, "Server Shutdown"),
                element("p", null, "The Shiny server has been shut down."),
                element("p", null, "To use it again, restart the server from the command line.")
            );
            screen.append(content);
            document.body.replaceChildren(screen);
        }

        function shutdownServer() {
            const button = document.querySelector(".shutdown-btn");
            if (isBusy(button)) {
                return;
            }
            const confirmed = confirm(
                "Are you sure you want to shutdown the entire Shiny server? " +
                "This will stop all applications and the management interface. " +
                "You will need to restart the server manually to continue using it."
            );

            if (!confirmed) {
                return;
            }

            const label = button.querySelector("span");
            setBusy(button, true);
            label.textContent = "Shutting down...";

            if (refreshInterval) {
                clearInterval(refreshInterval);
            }

            const restore = () => {
                setBusy(button, false);
                label.textContent = "Shutdown Server";
                refreshInterval = setInterval(refreshAll, 5000);
            };

            fetch("api/shutdown", {
                method: "POST",
                headers: { "X-TinyShinyServer-Request": "management" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showShutdownScreen();
                } else {
                    showNotice("Failed to shutdown server: " + errorText(data), "error");
                    restore();
                }
            })
            .catch(error => {
                console.error("Error shutting down server:", error);
                showNotice("Error shutting down server: " + error.message, "error");
                restore();
            });
        }

        function refreshAll() {
            updateSystemStatus();
            updateApps();
            updateConnections();
        }

        // Initial load
        setConnectionStatus(true);
        refreshAll();

        // Auto-refresh every 5 seconds
        refreshInterval = setInterval(refreshAll, 5000);
    </script>
</body>
</html>
